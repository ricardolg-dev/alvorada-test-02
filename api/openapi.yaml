openapi: 3.1.0
info:
  title: Conflict-free bookings API
  version: 0.0.1
  description: >
    REST API for booking shared resources without overlaps. Rules come from
    `.issues/docs/PRD.md` and the design from `docs/diagrams/architecture.md`.
    This file is the contract: keep it in sync with every controller.
servers:
  - url: http://localhost:3001
# Authentication is out of scope (PRD).
security: []
paths:
  /booking-batches:
    post:
      operationId: createBookingBatch
      summary: Create one to ten bookings atomically
      description: >
        Follows docs/booking-batches.md. Validate all items and distinct request
        IDs first. Check resources, occupied IDs and conflicts in request order.
        Include same-batch overlaps. A rejection or storage failure writes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bookings]
              properties:
                bookings:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items:
                    $ref: '#/components/schemas/CreateBookingRequest'
      responses:
        '201':
          description: All created booking views in request order.
          content:
            application/json:
              schema:
                type: object
                required: [bookings]
                properties:
                  bookings:
                    type: array
                    items:
                      $ref: '#/components/schemas/Booking'
        '422':
          description: Invalid envelope or item, including repeated request IDs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchFailure'
        '404':
          description: Unknown resource at the reported index.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchFailure'
        '409':
          description: Taken ID or overlap with a stored or earlier batch booking.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchFailure'
        '503':
          description: Storage failure; the complete batch is rolled back.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchFailure'
  /health:
    get:
      operationId: getHealth
      summary: Check that the API can reach the database
      responses:
        '200':
          description: The database answered `SELECT 1` within 2 seconds.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
        '503':
          description: The database did not answer, or took longer than 2 seconds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NestError'
  /resources:
    get:
      operationId: listResources
      summary: List the fixed resources, in ascending id order
      responses:
        '200':
          description: Every resource, seeded R1 to R5.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Resource'
              example:
                - { id: R1, name: Agora Room }
                - { id: R2, name: Pixel Room }
  /bookings:
    get:
      operationId: listBookings
      summary: List every booking, active and canceled, in ascending id order
      description: >
        Takes no query params; unknown ones are ignored. Ids are ordered by
        character code (`10` before `9`, `B` before `a`). Returns `[]` when
        there are no bookings.
      responses:
        '200':
          description: Every booking with its status and its resource nested.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Booking'
              example:
                - id: A
                  resource: { id: R1, name: Agora Room }
                  start: 10
                  end: 20
                  status: canceled
                - id: B
                  resource: { id: R1, name: Agora Room }
                  start: 20
                  end: 30
                  status: active
    post:
      operationId: createBooking
      summary: Create a booking, or reject it without writing anything
      description: >
        Checks run in this order and the first failure wins: `invalid_data`,
        `unknown_resource`, `id_taken`, `conflict`. A rejection writes no row,
        so its id can be used again. Extra fields in the body are ignored.
        Since SCH-16, a time above 100 answers `invalid_data`; bookings stored
        earlier stay valid.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookingRequest'
            example: { id: A, resource: R1, start: 10, end: 20 }
      responses:
        '201':
          description: Created with status `active`. Times are numbers, even when sent as strings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
              example:
                id: A
                resource: { id: R1, name: Agora Room }
                start: 10
                end: 20
                status: active
        '400':
          description: >
            Malformed JSON, or a top-level `null` or string body. Rejected by
            the JSON parser before validation, so it has Nest's default body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NestError'
        '404':
          description: '`unknown_resource`: the resource is not in the fixed list (exact match).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
              example:
                error: unknown_resource
                message: This resource does not exist.
        '409':
          description: >
            `id_taken`: a booking with this id exists, active or canceled.
            `conflict`: the interval overlaps active bookings of the same resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
              examples:
                id_taken:
                  value:
                    error: id_taken
                    message: This id was already used by another booking.
                conflict:
                  value:
                    error: conflict
                    message: The interval overlaps active bookings of this resource.
                    conflicts: [A, B]
        '422':
          description: >
            `invalid_data`: the body is not an object, or a field is missing or
            invalid (see `CreateBookingRequest`), or `start >= end`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
              example:
                error: invalid_data
                message: Send id (1 to 64 letters, digits, - or _), resource, and integer start and end from 0 to 100 with start before end.
  /bookings/{id}/cancel:
    post:
      operationId: cancelBooking
      summary: Cancel a booking, keeping its id taken
      description: >
        Sets the booking's status to `canceled` and keeps the row, so its
        interval is free again but its id still answers `id_taken` on create.
        Canceling a canceled booking changes nothing and answers
        `already_canceled`. The request body is ignored.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The booking id, matched exactly (case-sensitive).
      responses:
        '200':
          description: Canceled now, or already canceled; `result` tells which.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelResult'
              examples:
                canceled:
                  value:
                    result: canceled
                    booking:
                      id: A
                      resource: { id: R1, name: Agora Room }
                      start: 10
                      end: 20
                      status: canceled
                alreadyCanceled:
                  value:
                    result: already_canceled
                    booking:
                      id: A
                      resource: { id: R1, name: Agora Room }
                      start: 10
                      end: 20
                      status: canceled
        '400':
          description: >
            Malformed JSON body, or a path id with an invalid percent-encoding
            (for example `%ZZ`). Rejected before the handler, so it has Nest's
            default body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NestError'
        '404':
          description: >
            `not_found`: no booking has this id, or the id cannot exist (not 1
            to 64 letters, digits, `-` or `_`). An empty id or one containing
            `/` never reaches the handler and gets Nest's default 404 body
            (`NestError`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
              example:
                error: not_found
                message: No booking has this id.
  /availability:
    get:
      operationId: checkAvailability
      summary: Check whether an interval on a resource is free, without booking it
      description: >
        Read-only: writes nothing and holds nothing, so an available interval
        can still be taken by the next create. Checks run in the same order as
        create and the first failure wins: `invalid_data`, `unknown_resource`,
        `id_taken` (only when `id` is sent). Only active bookings of the same
        resource conflict, with the half-open rule `[start, end)`. Extra query
        params are ignored; a repeated `resource`, `start`, `end` or `id` is
        `invalid_data`.
      parameters:
        - name: resource
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            example: R1
        - name: start
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d+$'
            example: '19'
          description: An integer time from 0 to 100, before `end`.
        - name: end
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d+$'
            example: '21'
          description: An integer time from 0 to 100, after `start`.
        - name: id
          in: query
          required: false
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]{1,64}$'
            example: C
          description: >
            Optional. The id the next create would use. When sent, an id that a
            booking already has, active or canceled, answers `id_taken`.
      responses:
        '200':
          description: Answered, available or not.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Availability'
              examples:
                available:
                  value: { available: true, conflicts: [] }
                notAvailable:
                  value: { available: false, conflicts: [A, B] }
        '404':
          description: '`unknown_resource`: the resource is not in the fixed list (exact match).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
              example:
                error: unknown_resource
                message: This resource does not exist.
        '409':
          description: '`id_taken`: `id` was sent and a booking with this id exists, active or canceled. Conflicts are not listed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
              example:
                error: id_taken
                message: This id was already used by another booking.
        '422':
          description: >
            `invalid_data`: `resource`, `start` or `end` is missing, empty or
            repeated, a time is not an integer from 0 to 100,
            `start >= end`, or `id` is sent empty, repeated or not 1 to 64
            letters, digits, `-` or `_`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
              example:
                error: invalid_data
                message: Send resource, integer start and end from 0 to 100 with start before end, and optionally an id (1 to 64 letters, digits, - or _).
components:
  schemas:
    BatchFailure:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum: [invalid_data, unknown_resource, id_taken, conflict, unavailable]
        index:
          type: integer
          minimum: 0
          maximum: 9
        conflicts:
          type: array
          items:
            type: string
    Resource:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          example: R1
        name:
          type: string
          example: Agora Room
    Time:
      description: An integer time from 0 to 100, as a number or a digit-only string.
      oneOf:
        - type: integer
          minimum: 0
          maximum: 100
        - type: string
          pattern: '^\d+$'
    CreateBookingRequest:
      description: '`start` must be before `end`: the interval is half-open, `[start, end)`.'
      type: object
      required: [id, resource, start, end]
      properties:
        id:
          type: string
          pattern: '^[A-Za-z0-9_-]{1,64}$'
          description: Chosen by the client. Case-sensitive.
        resource:
          type: string
          minLength: 1
          example: R1
        start:
          $ref: '#/components/schemas/Time'
        end:
          $ref: '#/components/schemas/Time'
    Booking:
      description: >
        A booking as every response returns it. Requests send the resource id
        (`"resource": "R1"`); responses nest the resource with its name
        (docs/adr/0001-nested-resource-in-booking-responses.md). A booking
        stored before the bookable window existed may end past 100.
      type: object
      required: [id, resource, start, end, status]
      properties:
        id:
          type: string
        resource:
          $ref: '#/components/schemas/Resource'
        start:
          type: integer
        end:
          type: integer
        status:
          type: string
          enum: [active, canceled]
    BookingError:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          enum: [invalid_data, unknown_resource, id_taken, conflict, not_found]
        message:
          type: string
          description: For people; clients branch on `error`.
        conflicts:
          type: array
          items:
            type: string
          description: >
            Only on `conflict`: the ids of the overlapping active bookings, in
            ascending id order by character code (`10` before `9`, `B` before `a`).
    CancelResult:
      type: object
      required: [result, booking]
      properties:
        result:
          type: string
          enum: [canceled, already_canceled]
          description: '`canceled` when this call canceled it; `already_canceled` when nothing changed.'
        booking:
          $ref: '#/components/schemas/Booking'
    Availability:
      type: object
      required: [available, conflicts]
      properties:
        available:
          type: boolean
          description: True when `conflicts` is empty.
        conflicts:
          type: array
          items:
            type: string
          description: >
            The ids of the overlapping active bookings of the resource, in
            ascending id order by character code (`10` before `9`, `B` before `a`).
    NestError:
      description: Nest's default exception body.
      type: object
      required: [statusCode, message]
      properties:
        statusCode:
          type: integer
        message:
          type: string
